<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark background for contrast */
            margin: 0;
            overflow-x: hidden; /* Prevent horizontal scroll */
            min-height: 300vh; /* Make body much taller to allow extensive scrolling */
            color: white; /* Default text color */
        }

        /* Keyframes for the zoom-in/out effect, controlled by scroll */
        @keyframes zoom-in {
            0% {
                transform: translateZ(-1000px); /* Start far away */
                opacity: 0;
                filter: blur(5px);
            }
            25% {
                transform: translateZ(250px); /* Fully visible */
                opacity: 1;
                filter: blur(0px);
            }
             50% {
                transform: translateZ(500px); /* Fully visible */
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                transform: translateZ(1000px); /* Move far away again */
                opacity: 0;
                filter: blur(5px);
            }
        }

        .stuck-container {
            block-size: 100svh; /* Occupy full viewport height */
            perspective: 1000px; /* Enable 3D transforms */
            transform-style: preserve-3d; /* Preserve 3D transforms for children */
            display: flex; /* Center the h1 */
            justify-content: center;
            align-items: center;
            position: sticky; /* Make it stick to the top during its scroll range */
            top: 0; /* Stick to the top of the viewport */
            overflow: clip; /* Hide content that goes outside this container */
            background-color: transparent; /* Ensure background is transparent */
            z-index: 10; /* Ensure it's above other content if any */
        }

        /* Styling for the h1 tag */
        .animated-h1 {
            font-size: 5rem; /* Large font size */
            font-weight: 700;
            color: #63b3ed; /* Light blue color */
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4); /* Subtle shadow */
            padding: 1rem 2rem;
            border-radius: 1.5rem; /* Rounded corners */
            background: linear-gradient(45deg, #a78bfa, #81e6d9); /* Gradient background */
            -webkit-background-clip: text; /* Clip background to text for gradient effect */
            background-clip: text;
            -webkit-text-fill-color: transparent; /* Make text transparent to show gradient */

            /* Apply the animation and link it to the scroll timeline */
            animation: zoom-in linear both; /* Use the zoom-in keyframes */
            animation-timeline: scroll(root block); /* Link animation to the document's scroll */
            /* Define the scroll range over which the animation plays */
            /* The animation will play from 0% to 100% as the document scrolls from 40% to 60% */
            animation-range: 40% 60%;
            will-change: transform, opacity, filter; /* Optimize for animation performance */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .animated-h1 {
                font-size: 3rem; /* Adjust font size for smaller screens */
                padding: 0.75rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .animated-h1 {
                font-size: 2rem; /* Further adjust for very small screens */
                padding: 0.5rem 1rem;
            }
        }

        /* Spacers to create scrollable area */
        .scroll-spacer {
            height: 100vh; /* Each spacer takes up a full viewport height */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: #a0aec0; /* Gray text for instructions */
            text-align: center;
        }
    </style>
</head>
<body>
       
    <div class="stuck-container">
        <h1 class="animated-h1">Ayush</h1>
    </div>
    <div class="scroll-spacer">
        <h1 class="h1">Ayush</h1>
    </div>
</body>
    </html>
